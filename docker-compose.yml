services:
  xenvia-backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - SYNC_CRON=0 3 * * *
      - SYNC_ON_BOOT=false
      - CATALOG_WINDOW_YEARS=5
      - SCRAPE_DELAY_MS=1200
      - ENABLE_GSMARENA=false
      - ENABLE_WHATMOBILE=false
      - CORS_ORIGIN=*
    volumes:
      - xenvia-data:/app/data
    restart: unless-stopped

volumes:
  xenvia-data:
